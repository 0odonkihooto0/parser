services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FIRECRAWL_API_KEY=local
      - FIRECRAWL_URL=http://firecrawl-api:3002
      # Address Firecrawl uses to fetch uploads when its /parse endpoint is
      # unavailable (older images). Must be resolvable inside the compose network.
      - INTERNAL_BASE_URL=http://parser.local:4000
      - DB_PATH=/app/data/parser.db
    volumes:
      - parser-data:/app/data
    networks:
      default:
        aliases:
          - parser.local
    depends_on:
      firecrawl-api:
        condition: service_started
    restart: unless-stopped

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - NUQ_RABBITMQ_URL=amqp://rabbitmq:5672
      - NUQ_DATABASE_URL=postgresql://postgres:postgres@nuq-postgres:5432/postgres
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000/scrape
      - USE_DB_AUTHENTICATION=false
      - NUM_WORKERS_PER_QUEUE=1
      - CRAWL_CONCURRENT_REQUESTS=5
      - MAX_CONCURRENT_JOBS=3
      - ALLOW_LOCAL_WEBHOOKS=true
    depends_on:
      nuq-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      playwright-service:
        condition: service_started
    restart: unless-stopped

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      - PORT=3000
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nuq-postgres:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./nuq-init.sql:/docker-entrypoint-initdb.d/010-nuq.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"SELECT 1 FROM nuq.queue_scrape LIMIT 0\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  parser-data:
  redis-data:
  postgres-data:
